version: "3.8"
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus_test
      POSTGRES_PASSWORD: nexus_test_pass
      POSTGRES_DB: nexus_test
    ports:
      - "5433:5432"
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_test"]
      interval: 1s
      timeout: 3s
      retries: 10
